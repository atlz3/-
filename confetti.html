<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Праздник тупости с конфетти и танцующими эмодзи">
    <title>Праздник тупости</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f39c12;
            pointer-events: none;
            animation: fall linear infinite;
            z-index: 1;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        .party-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .party-title {
            font-size: 3rem;
            margin-bottom: 10px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .party-heading {
            color: #667eea;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .emoji-item {
            font-size: 3rem;
            animation: dance 0.8s infinite;
        }

        @keyframes dance {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(15deg) scale(1.1); }
            50% { transform: rotate(-15deg) scale(1); }
            75% { transform: rotate(15deg) scale(1.1); }
        }

        .emoji-item:nth-child(1) { animation-delay: 0s; }
        .emoji-item:nth-child(2) { animation-delay: 0.1s; }
        .emoji-item:nth-child(3) { animation-delay: 0.2s; }
        .emoji-item:nth-child(4) { animation-delay: 0.3s; }
        .emoji-item:nth-child(5) { animation-delay: 0.4s; }
        .emoji-item:nth-child(6) { animation-delay: 0.5s; }
        .emoji-item:nth-child(7) { animation-delay: 0.6s; }
        .emoji-item:nth-child(8) { animation-delay: 0.7s; }
        .emoji-item:nth-child(9) { animation-delay: 0.8s; }
        .emoji-item:nth-child(10) { animation-delay: 0.9s; }

        .party-message {
            font-size: 1.2rem;
            color: #333;
            margin: 20px 0;
            font-weight: 600;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin: 30px 0;
            justify-content: center;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            color: white;
        }

        .btn-confetti {
            background: #e74c3c;
        }

        .btn-confetti:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .btn-sound {
            background: #f39c12;
        }

        .btn-sound:hover {
            background: #e67e22;
            transform: translateY(-2px);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        @media (max-width: 480px) {
            .party-container {
                padding: 25px;
            }

            .party-title {
                font-size: 2rem;
            }

            .party-heading {
                font-size: 1.5rem;
            }

            .emoji-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .emoji-item {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="party-container">
            <div class="party-title">🎉</div>
            <h1 class="party-heading">ПРАЗДНИК ТУПОСТИ!</h1>
            <p class="party-message">Добро пожаловать на самую тупую вечеринку в интернете! 🤡</p>

            <div class="emoji-grid">
                <div class="emoji-item">🎉</div>
                <div class="emoji-item">🤡</div>
                <div class="emoji-item">🎊</div>
                <div class="emoji-item">🎈</div>
                <div class="emoji-item">✨</div>
                <div class="emoji-item">🎪</div>
                <div class="emoji-item">😂</div>
                <div class="emoji-item">🎭</div>
                <div class="emoji-item">🎲</div>
                <div class="emoji-item">🎯</div>
            </div>

            <p class="party-message" style="font-size: 1.5rem; color: #667eea;">Нажимай кнопки и устраивай хаос! 🌪️</p>

            <div class="button-group">
                <button class="action-btn btn-confetti" onclick="createConfetti()">🎉 Конфетти!</button>
                <button class="action-btn btn-sound" onclick="playSound()">🔊 Звук!</button>
            </div>

            <div class="back-link">
                <a href="index.html" class="link">← Вернуться на главную</a>
            </div>
        </div>
    </main>

    <script>
        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = getRandomColor();
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }

        function getRandomColor() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#6c5ce7', '#a29bfe', '#fd79a8', '#fdcb6e'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function playSound() {
            // Создаём звук с помощью Web Audio API
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 0.1);

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }
    </script>
</body>
</html>
